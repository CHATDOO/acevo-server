services:
  acevo:
    image: acevo-ptero:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acevo-dedicated-server
    restart: unless-stopped
    ports:
      # Game ports (Match SERVER_TCP_PORT & SERVER_UDP_PORT)
      - "${SERVER_TCP_PORT:-9600}:${SERVER_TCP_PORT:-9600}/tcp"
      - "${SERVER_UDP_PORT:-9600}:${SERVER_UDP_PORT:-9600}/udp"
      # Web Dashboard GUI (Direct access locally or via reverse proxy)
      - "${DASHBOARD_PORT:-8090}:8090"
    environment:
      - SERVER_TCP_PORT=${SERVER_TCP_PORT:-9600}
      - SERVER_UDP_PORT=${SERVER_UDP_PORT:-9600}
      - SERVER_HTTP_PORT=48080
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-Admin1234!}
      - STEAM_USERNAME=${STEAM_USERNAME:-your_steam_burner_account}
      - STEAM_PASSWORD=${STEAM_PASSWORD:-your_steam_password}
    volumes:
      # Persistent game files, configs, and logs
      - ./server-data:/home/container
